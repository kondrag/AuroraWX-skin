    # Aurora / capture integration
    # -------------------------------------------------------------------------
    #
        [[Aurora]]

        # Directory the external capture pipeline writes into.
        # Empty disables the whole aurora section.
        cam_dir =

        # URL prefix under which the web server serves cam_dir
        # (web-server alias; this skin never copies image files).
        cam_url = /cam

        # Local time (HH:MM) after which a still-missing night timelapse
        # means "still encoding" (night video finalizes early morning).
        night_publish_by = 07:00

        # Local time (HH:MM) after which a still-missing day timelapse
        # means "still encoding".
        day_publish_by = 19:00

        # snapshot.jpg older than this many minutes counts as stale.
        stale_after_minutes = 30

        # Client-side refresh intervals (seconds).
        snapshot_refresh_seconds = 30
        noaa_refresh_seconds = 120

        # NOAA SWPC feeds fetched by client-side JavaScript.
        kp_url = https://services.swpc.noaa.gov/json/planetary_k_index_1m.json
        wind_url = https://services.swpc.noaa.gov/json/rtsw/rtsw_wind_1m.json
        mag_url = https://services.swpc.noaa.gov/json/rtsw/rtsw_mag_1m.json
        xrays_url = https://services.swpc.noaa.gov/json/goes/primary/xrays-6-hour.json
        flux_url = https://services.swpc.noaa.gov/products/summary/10cm-flux.json
        regions_url = https://services.swpc.noaa.gov/json/solar_regions.json
        kp_forecast_url = https://services.swpc.noaa.gov/products/noaa-planetary-k-index-forecast.json
        # Feeds for the R/S/G scale chips on the Current page. These are
        # fetched on a slower cadence (~10 min) by aurora.js.
        xrays_long_url = https://services.swpc.noaa.gov/json/goes/primary/xrays-3-day.json
        protons_url = https://services.swpc.noaa.gov/json/goes/primary/integral-protons-1-day.json
        # Filename of the Clear Sky Chart (cleardarksky.com) image that the
        # external pipeline refreshes inside cam_dir; "" hides the card.
        clearsky_chart_filename = clearsky_chart.gif

        # Cameras shown side-by-side on the Cameras page (aurora.html).
        # The first camera doubles as the section's live/stale status.
        # NOTE: keep this nested section LAST in [[Aurora]] — configobj
        # attaches any later bare keys to the innermost section.
        [[[cameras]]]
            [[[[sky]]]]
                label = Sky camera
                image = snapshot.jpg
            [[[[ground]]]]
                label = Ground camera
                image = Driveway.jpg


# Observation labels
# -----------------------------------------------------------------------------
#
# Used by $obs.label.<name> (values cards, chart titles). Falls back to the
# raw key name when a label is not defined anywhere.
#
[Labels]
    [[Generic]]
        appTemp = Apparent Temperature
        cloudbase = Cloud Base

# Cheetah templating engine configuration
# -----------------------------------------------------------------------------
#
# This section describes all templates and their generated files
#
[CheetahGenerator]

    # Possible encodings are 'html_entities', 'utf8', or 'strict_ascii'
    encoding = utf8

    # Search list extensions used by all templates of this skin
    search_list_extensions = user.aurorawx.searchlist.AuroraSearchList

    [[SummaryByMonth]]
        # Reports which summarize by month
        [[[month_summary]]]
            template = month-%Y-%m.html.tmpl
        [[[month_NOAA]]]
            encoding = utf8
            template = archive/NOAA-%Y-%m.txt.tmpl

    [[SummaryByYear]]
        # Reports which summarize by year
        [[[year_summary]]]
            template = year-%Y.html.tmpl
        [[[year_NOAA]]]
            encoding = utf8
            template = archive/NOAA-%Y.txt.tmpl

    [[ToDate]]
        # Reports which show statistics (e.g. day) to date
        [[[day]]]
            template = index.html.tmpl

        [[[yesterday]]]
            template = yesterday.html.tmpl

        [[[week]]]
            template = week.html.tmpl

        [[[month]]]
            template = month.html.tmpl

        [[[year]]]
            template = year.html.tmpl

        [[[archive]]]
            template = archive.html.tmpl

        [[[almanac]]]
            template = almanac.html.tmpl

        [[[telemetry]]]
            template = telemetry.html.tmpl

        [[[aurora]]]
            template = aurora.html.tmpl

        [[[gallery]]]
            template = gallery.html.tmpl

        [[[solar]]]
            template = solar.html.tmpl


# File copy configuration
# -----------------------------------------------------------------------------
#
# This section describes all files which should be copied
#
[CopyGenerator]

    # List of files to be copied only the first time
    copy_once = css/*, js/*, weather-icons/*, img/*, fonts/*, manifest.json

    # List of files to be copied each run (except templates)
    # copy_always =


# Generator configuration
# -----------------------------------------------------------------------------
#
# This section describes all generators mentioned above
#
[Generators]
    generator_list = weewx.cheetahgenerator.CheetahGenerator, weewx.reportengine.CopyGenerator
